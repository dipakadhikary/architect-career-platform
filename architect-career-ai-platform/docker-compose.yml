services:
  ai-platform:
    build: .
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      APP_ENV: production
#      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
#      redis:
#        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/api/v1/system/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

#  redis:
#    image: redis:7-alpine
#    ports:
#      - "6379:6379"
#    healthcheck:
#      test: ["CMD", "redis-cli", "ping"]
#      interval: 10s
#      timeout: 3s
#      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: my-secret-key
volumes:
  qdrant_data:
