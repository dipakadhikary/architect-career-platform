services:
  ai-platform:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8090 --reload
    ports:
      - "8090:8090"
    env_file:
      - .env.example
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./app:/app/app
      - ./third_party:/app/third_party
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_dev_data:/qdrant/storage

volumes:
  qdrant_dev_data:
