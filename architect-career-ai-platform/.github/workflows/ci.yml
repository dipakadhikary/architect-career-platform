name: AI Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./third_party/acos_ai_contracts
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit bandit

      - name: Ruff
        run: ruff check app tests

      - name: Black
        run: black --check app tests

      - name: Mypy
        continue-on-error: true
        run: mypy app

      - name: Pytest with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=55

      - name: Contract compatibility check
        run: python scripts/check_contract_compatibility.py

      - name: Dependency scan
        continue-on-error: true
        run: pip-audit

      - name: Security scan (bandit)
        continue-on-error: true
        run: bandit -q -r app -x tests -ll

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t acos-ai-platform:ci .

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: acos-ai-platform:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
