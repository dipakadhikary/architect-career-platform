[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "architect-career-ai-platform"
version = "0.1.0"
description = "Reusable, domain-agnostic ACOS AI Platform foundation"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "ACOS Platform Engineering" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "dependency-injector>=4.42.0",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "opentelemetry-exporter-otlp>=1.28.0",
  "redis>=5.2.0",
  "qdrant-client>=1.12.0",
  "openai>=1.55.0",
  "ollama>=0.4.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "langfuse>=2.53.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.12",
  "orjson>=3.10.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "langdetect>=1.0.9",
  "acos-ai-contracts @ file:./third_party/acos_ai_contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
  "types-redis>=4.6.0",
  "types-python-jose>=3.3.0",
]

[project.scripts]
acos-ai-platform = "app.main:run"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
# The platform directory is gitignored, so VCS filtering would omit new modules.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = ["S101", "S104", "UP047", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = []
mypy_path = "app"
packages = ["app"]
exclude = ["third_party/", "scripts/_bootstrap_foundation.py"]

[[tool.mypy.overrides]]
module = [
  "dependency_injector.*",
  "langfuse.*",
  "ollama.*",
  "qdrant_client.*",
  "langgraph.*",
  "langchain_core.*",
  "acos_ai_contracts.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-p no:deepeval"
