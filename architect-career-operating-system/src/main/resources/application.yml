spring:
  application:
    name: acos-platform
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  cloud:
    openfeign:
      circuitbreaker:
        # Resilience is applied by AiPlatformInvoker (Retry, CircuitBreaker, TimeLimiter, Bulkhead).
        enabled: false
      compression:
        request:
          enabled: ${AI_PLATFORM_REQUEST_COMPRESSION:true}
          mime-types: application/json,application/xml,text/xml
          min-request-size: ${AI_PLATFORM_MIN_REQUEST_SIZE:2048}
        response:
          enabled: ${AI_PLATFORM_RESPONSE_COMPRESSION:true}
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 30000
            loggerLevel: basic
          knowledge-ai:
            connectTimeout: 3000
            readTimeout: 30000
            loggerLevel: basic
          learning-ai:
            connectTimeout: 3000
            readTimeout: 30000
            loggerLevel: basic
          career-ai:
            connectTimeout: 3000
            readTimeout: 30000
            loggerLevel: basic
          portfolio-ai:
            connectTimeout: 3000
            readTimeout: 30000
            loggerLevel: basic

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
    info:
      enabled: true
  health:
    group:
      readiness:
        include: readinessState,db,aiPlatform
      liveness:
        include: livenessState
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
  packages-to-scan: com.acos

info:
  app:
    name: ${spring.application.name}
    description: Architect Career Operating System
    encoding: UTF-8

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name:},%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.acos: INFO
    com.acos.integration.client.KnowledgeAiClient: DEBUG
    com.acos.integration.client.LearningAiClient: DEBUG
    com.acos.integration.client.CareerAiClient: DEBUG
    com.acos.integration.client.PortfolioAiClient: DEBUG

acos:
  jwt:
    secret: ${ACOS_JWT_SECRET:change-me-to-a-secure-secret-key-at-least-32-chars}
    issuer: ${ACOS_JWT_ISSUER:acos-platform}
    access-token-ttl: ${ACOS_JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${ACOS_JWT_REFRESH_TTL:7d}
  dashboard:
    welcome-message-prefix: "Welcome to ACOS, "
    profile-completion: 45
    active-learning-plans: 2
    completed-courses: 3
    portfolio-projects: 1
    job-applications: 4
    upcoming-interviews: 2
  knowledge:
    max-content-length: 100000
    max-tags-per-note: 20
    max-page-size: 100
  learning:
    max-page-size: 100
    max-milestones-per-plan: 50
    max-topics-per-milestone: 100
  portfolio:
    max-page-size: 100
    max-technologies-per-project: 30
    max-description-length: 50000
  career:
    max-page-size: 100
    max-notes-length: 2000
    max-job-description-length: 10000

ai:
  platform:
    enabled: ${AI_PLATFORM_ENABLED:false}
    base-url: ${AI_PLATFORM_BASE_URL:http://localhost:8090}
    api-key: ${AI_PLATFORM_API_KEY:}
    connection-timeout: ${AI_PLATFORM_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_PLATFORM_READ_TIMEOUT:30s}
    logger-level: ${AI_PLATFORM_LOGGER_LEVEL:BASIC}
    compression:
      request-enabled: ${AI_PLATFORM_REQUEST_COMPRESSION:true}
      response-enabled: ${AI_PLATFORM_RESPONSE_COMPRESSION:true}
      min-request-size: ${AI_PLATFORM_MIN_REQUEST_SIZE:2048}
    resilience:
      instance: ${AI_PLATFORM_RESILIENCE_INSTANCE:ai-platform}
    retry:
      enabled: ${AI_PLATFORM_RETRY_ENABLED:true}
      max-attempts: ${AI_PLATFORM_RETRY_MAX_ATTEMPTS:3}
      period: ${AI_PLATFORM_RETRY_PERIOD:200ms}
      max-period: ${AI_PLATFORM_RETRY_MAX_PERIOD:2s}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: false
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 10s
    instances:
      ai-platform:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        ignoreExceptions:
          - com.acos.integration.exception.AiValidationException
          - com.acos.integration.exception.AiAuthenticationException
    instances:
      ai-platform:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true
    instances:
      ai-platform:
        baseConfig: default
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 20
        maxWaitDuration: 0
    instances:
      ai-platform:
        baseConfig: default
