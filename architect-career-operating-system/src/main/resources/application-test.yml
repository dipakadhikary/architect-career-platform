spring:
  config:
    activate:
      on-profile: test

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: acos
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: acos
    default-schema: acos
    create-schemas: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.acos: INFO
    org.testcontainers: INFO
