spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://${ACOS_DB_HOST:localhost}:${ACOS_DB_PORT:5432}/${ACOS_DB_NAME:postgres}?currentSchema=acos
    username: ${ACOS_DB_USER:test}
    password: ${ACOS_DB_PASSWORD:test}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: acos-local-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: acos
        format_sql: true

  flyway:
    enabled: true
    schemas: acos
    default-schema: acos
    create-schemas: true
    locations: classpath:db/migration
    table: flyway_schema_history

server:
  port: 8080

ai:
  platform:
    enabled: true
    base-url: http://localhost:8090

logging:
  level:
    root: INFO
    com.acos: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
