openapi: 3.1.0
info:
  title: ACOS AI Security Schemas
  version: 1.0.0

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token issued by the ACOS Business Platform.
        Propagated by Spring Boot Feign clients and future direct consumers.

    serviceApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Optional service-to-service API key for trusted internal callers.

  headers:
    X-Correlation-Id:
      description: Correlation identifier for distributed tracing.
      required: false
      schema:
        $ref: './common.yaml#/components/schemas/CorrelationId'

    X-Request-Id:
      description: Unique request identifier.
      required: false
      schema:
        $ref: './common.yaml#/components/schemas/RequestId'

    X-Schema-Version:
      description: Contract schema version understood by the caller.
      required: false
      schema:
        $ref: './common.yaml#/components/schemas/SchemaVersion'

  parameters:
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        $ref: './common.yaml#/components/schemas/CorrelationId'
      description: Correlation identifier. Generated by the gateway when absent.

    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        $ref: './common.yaml#/components/schemas/RequestId'
      description: Unique request identifier. Generated by the gateway when absent.

    SchemaVersionHeader:
      name: X-Schema-Version
      in: header
      required: false
      schema:
        $ref: './common.yaml#/components/schemas/SchemaVersion'
      description: Caller-declared schema version for compatibility negotiation.
