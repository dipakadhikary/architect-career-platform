openapi: 3.1.0
info:
  title: ACOS AI Error Responses
  version: 1.0.0

components:
  responses:
    BadRequest:
      description: Invalid request payload or parameters.
      headers:
        X-Correlation-Id:
          $ref: './security.yaml#/components/headers/X-Correlation-Id'
        X-Request-Id:
          $ref: './security.yaml#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/ProblemDetails'
          example:
            type: https://acos.local/problems/ai-validation-failed
            title: Validation Failed
            status: 400
            detail: Field 'userId' is required
            code: AI_VALIDATION_FAILED
            errors:
              - field: userId
                message: must not be null

    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/ProblemDetails'
          example:
            type: https://acos.local/problems/ai-authentication-failed
            title: Unauthorized
            status: 401
            detail: Bearer token is missing or invalid
            code: AI_AUTHENTICATION_FAILED

    Forbidden:
      description: Authenticated caller is not permitted to invoke this capability.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/ProblemDetails'
          example:
            type: https://acos.local/problems/ai-forbidden
            title: Forbidden
            status: 403
            detail: Caller is not authorized for Career AI

    NotFound:
      description: Requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/ProblemDetails'
          example:
            type: https://acos.local/problems/ai-not-found
            title: Not Found
            status: 404
            detail: Knowledge document was not found
            code: AI_NOT_FOUND

    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            example: 30
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/ProblemDetails'
          example:
            type: https://acos.local/problems/ai-rate-limited
            title: Too Many Requests
            status: 429
            detail: Rate limit exceeded for Knowledge AI
            code: AI_RATE_LIMITED

    InternalServerError:
      description: Unexpected AI Platform failure.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/ProblemDetails'
          example:
            type: https://acos.local/problems/ai-platform-error
            title: Internal Server Error
            status: 500
            detail: Unexpected processing failure
            code: AI_PLATFORM_ERROR

    ServiceUnavailable:
      description: AI Platform or dependent model provider is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/ProblemDetails'
          example:
            type: https://acos.local/problems/ai-platform-unavailable
            title: Service Unavailable
            status: 503
            detail: AI model provider is temporarily unavailable
            code: AI_PLATFORM_UNAVAILABLE

    GatewayTimeout:
      description: Upstream AI processing timed out.
      content:
        application/problem+json:
          schema:
            $ref: './common.yaml#/components/schemas/ProblemDetails'
          example:
            type: https://acos.local/problems/ai-timeout
            title: Gateway Timeout
            status: 504
            detail: AI processing exceeded the configured timeout
            code: AI_TIMEOUT
