asyncapi: 3.0.0
info:
  title: ACOS Knowledge AI Events
  version: 1.0.0
  description: |
    Asynchronous Knowledge AI events.
    Producers: acos-business-platform (domain changes), acos-ai-platform (indexing outcomes).
    Consumers: acos-ai-platform, acos-business-platform, future search indexers and agents.

defaultContentType: application/json

channels:
  knowledgeCreated:
    address: acos.ai.knowledge.created.v1
    messages:
      KnowledgeCreated:
        $ref: '#/components/messages/KnowledgeCreated'
    description: |
      Emitted when a knowledge note is created in the Business Platform and should be considered for AI indexing.
      Retry: exponential backoff (max 5). DLQ after exhaustion.

  knowledgeUpdated:
    address: acos.ai.knowledge.updated.v1
    messages:
      KnowledgeUpdated:
        $ref: '#/components/messages/KnowledgeUpdated'
    description: Emitted when knowledge content changes and re-indexing may be required.

  knowledgeIndexed:
    address: acos.ai.knowledge.indexed.v1
    messages:
      KnowledgeIndexed:
        $ref: '#/components/messages/KnowledgeIndexed'
    description: Emitted by the AI Platform after successful indexing.

  knowledgeIndexFailed:
    address: acos.ai.knowledge.index-failed.v1
    messages:
      KnowledgeIndexFailed:
        $ref: '#/components/messages/KnowledgeIndexFailed'
    description: Emitted by the AI Platform when indexing fails after retries within the worker.

operations:
  onKnowledgeCreated:
    action: receive
    channel:
      $ref: '#/channels/knowledgeCreated'
    summary: AI Platform receives KnowledgeCreated for indexing.
  publishKnowledgeCreated:
    action: send
    channel:
      $ref: '#/channels/knowledgeCreated'
    summary: Business Platform publishes KnowledgeCreated.
  onKnowledgeUpdated:
    action: receive
    channel:
      $ref: '#/channels/knowledgeUpdated'
  publishKnowledgeUpdated:
    action: send
    channel:
      $ref: '#/channels/knowledgeUpdated'
  onKnowledgeIndexed:
    action: receive
    channel:
      $ref: '#/channels/knowledgeIndexed'
  publishKnowledgeIndexed:
    action: send
    channel:
      $ref: '#/channels/knowledgeIndexed'
  onKnowledgeIndexFailed:
    action: receive
    channel:
      $ref: '#/channels/knowledgeIndexFailed'
  publishKnowledgeIndexFailed:
    action: send
    channel:
      $ref: '#/channels/knowledgeIndexFailed'

components:
  schemas:
    KnowledgeCreatedData:
      type: object
      additionalProperties: false
      required: [userId, noteId, title, createdAt]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        noteId:
          type: string
          format: uuid
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    KnowledgeUpdatedData:
      type: object
      additionalProperties: false
      required: [userId, noteId, updatedAt]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        noteId:
          type: string
          format: uuid
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time

    KnowledgeIndexedData:
      type: object
      additionalProperties: false
      required: [userId, noteId, documentId, indexedAt, status]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        noteId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        status:
          type: string
          const: INDEXED
        indexedAt:
          type: string
          format: date-time

    KnowledgeIndexFailedData:
      type: object
      additionalProperties: false
      required: [userId, noteId, failedAt, code, message, retryable]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        noteId:
          type: string
          format: uuid
        failedAt:
          type: string
          format: date-time
        code:
          type: string
          examples:
            - AI_PROCESSING_FAILED
        message:
          type: string
        retryable:
          type: boolean

  messages:
    KnowledgeCreated:
      name: KnowledgeCreated
      title: Knowledge created
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/KnowledgeCreatedData'
      examples:
        - name: noteCreated
          headers:
            correlationId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            eventId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
            schemaVersion: 1.0.0
            producedAt: 2026-08-07T08:00:00Z
            producer: acos-business-platform
          payload:
            userId: 11111111-1111-1111-1111-111111111111
            noteId: 22222222-2222-2222-2222-222222222222
            title: Hexagonal Architecture Notes
            tags: [architecture]
            createdAt: 2026-08-07T08:00:00Z

    KnowledgeUpdated:
      name: KnowledgeUpdated
      title: Knowledge updated
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/KnowledgeUpdatedData'

    KnowledgeIndexed:
      name: KnowledgeIndexed
      title: Knowledge indexed
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/KnowledgeIndexedData'

    KnowledgeIndexFailed:
      name: KnowledgeIndexFailed
      title: Knowledge index failed
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/KnowledgeIndexFailedData'
