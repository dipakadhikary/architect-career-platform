asyncapi: 3.0.0
info:
  title: ACOS Career AI Events
  version: 1.0.0
  description: |
    Asynchronous Career AI events.
    Producers: acos-business-platform, acos-ai-platform.
    Consumers: acos-business-platform, career agents, notification services.

defaultContentType: application/json

channels:
  interviewCompleted:
    address: acos.ai.career.interview-completed.v1
    messages:
      InterviewCompleted:
        $ref: '#/components/messages/InterviewCompleted'
    description: Emitted when an interview is marked completed and may require AI analysis.

  interviewAnalyzed:
    address: acos.ai.career.interview-analyzed.v1
    messages:
      InterviewAnalyzed:
        $ref: '#/components/messages/InterviewAnalyzed'
    description: Emitted after AI interview analysis completes.

  resumeGenerated:
    address: acos.ai.career.resume-generated.v1
    messages:
      ResumeGenerated:
        $ref: '#/components/messages/ResumeGenerated'
    description: Emitted after a resume is generated by Career AI.

operations:
  publishInterviewCompleted:
    action: send
    channel:
      $ref: '#/channels/interviewCompleted'
  onInterviewCompleted:
    action: receive
    channel:
      $ref: '#/channels/interviewCompleted'
  publishInterviewAnalyzed:
    action: send
    channel:
      $ref: '#/channels/interviewAnalyzed'
  onInterviewAnalyzed:
    action: receive
    channel:
      $ref: '#/channels/interviewAnalyzed'
  publishResumeGenerated:
    action: send
    channel:
      $ref: '#/channels/resumeGenerated'
  onResumeGenerated:
    action: receive
    channel:
      $ref: '#/channels/resumeGenerated'

components:
  schemas:
    InterviewCompletedData:
      type: object
      additionalProperties: false
      required: [userId, interviewId, completedAt]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        interviewId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        completedAt:
          type: string
          format: date-time
        hasTranscript:
          type: boolean

    InterviewAnalyzedData:
      type: object
      additionalProperties: false
      required: [userId, interviewId, analyzedAt]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        interviewId:
          type: string
          format: uuid
        analyzedAt:
          type: string
          format: date-time
        score:
          type: number
          format: double
          minimum: 0
          maximum: 100
        summary:
          type: string

    ResumeGeneratedData:
      type: object
      additionalProperties: false
      required: [userId, targetRole, generatedAt, format]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        targetRole:
          type: string
        generatedAt:
          type: string
          format: date-time
        format:
          type: string
          enum: [markdown, plain]
        documentId:
          type: string
          format: uuid

  messages:
    InterviewCompleted:
      name: InterviewCompleted
      title: Interview completed
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/InterviewCompletedData'
      examples:
        - name: interviewDone
          headers:
            correlationId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            eventId: c3d4e5f6-a7b8-9012-cdef-123456789012
            schemaVersion: 1.0.0
            producedAt: 2026-08-07T10:00:00Z
            producer: acos-business-platform
          payload:
            userId: 11111111-1111-1111-1111-111111111111
            interviewId: 66666666-6666-6666-6666-666666666666
            completedAt: 2026-08-07T10:00:00Z
            hasTranscript: true

    InterviewAnalyzed:
      name: InterviewAnalyzed
      title: Interview analyzed
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/InterviewAnalyzedData'

    ResumeGenerated:
      name: ResumeGenerated
      title: Resume generated
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/ResumeGeneratedData'
