asyncapi: 3.0.0
info:
  title: ACOS Learning AI Events
  version: 1.0.0
  description: |
    Asynchronous Learning AI events.
    Producers: acos-business-platform, acos-ai-platform.
    Consumers: acos-business-platform, learning agents, notification services.

defaultContentType: application/json

channels:
  learningPlanCompleted:
    address: acos.ai.learning.plan-completed.v1
    messages:
      LearningPlanCompleted:
        $ref: '#/components/messages/LearningPlanCompleted'
    description: Emitted when a learning plan reaches completion. Retry max 5; DLQ enabled.

  quizGenerated:
    address: acos.ai.learning.quiz-generated.v1
    messages:
      QuizGenerated:
        $ref: '#/components/messages/QuizGenerated'
    description: Emitted after a quiz is successfully generated by the AI Platform.

operations:
  publishLearningPlanCompleted:
    action: send
    channel:
      $ref: '#/channels/learningPlanCompleted'
  onLearningPlanCompleted:
    action: receive
    channel:
      $ref: '#/channels/learningPlanCompleted'
  publishQuizGenerated:
    action: send
    channel:
      $ref: '#/channels/quizGenerated'
  onQuizGenerated:
    action: receive
    channel:
      $ref: '#/channels/quizGenerated'

components:
  schemas:
    LearningPlanCompletedData:
      type: object
      additionalProperties: false
      required: [userId, planId, completedAt, progressPercent]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        planId:
          type: string
          format: uuid
        completedAt:
          type: string
          format: date-time
        progressPercent:
          type: number
          format: double
          minimum: 0
          maximum: 100
        title:
          type: string

    QuizGeneratedData:
      type: object
      additionalProperties: false
      required: [userId, quizId, topic, generatedAt, questionCount]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        quizId:
          type: string
          format: uuid
        topic:
          type: string
        generatedAt:
          type: string
          format: date-time
        questionCount:
          type: integer
          minimum: 1
        difficulty:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]

  messages:
    LearningPlanCompleted:
      name: LearningPlanCompleted
      title: Learning plan completed
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/LearningPlanCompletedData'
      examples:
        - name: planDone
          headers:
            correlationId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            eventId: b2c3d4e5-f6a7-8901-bcde-f12345678901
            schemaVersion: 1.0.0
            producedAt: 2026-08-07T09:00:00Z
            producer: acos-business-platform
          payload:
            userId: 11111111-1111-1111-1111-111111111111
            planId: 55555555-5555-5555-5555-555555555555
            completedAt: 2026-08-07T09:00:00Z
            progressPercent: 100
            title: Backend Architecture Track

    QuizGenerated:
      name: QuizGenerated
      title: Quiz generated
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/QuizGeneratedData'
