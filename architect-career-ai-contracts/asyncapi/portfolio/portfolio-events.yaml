asyncapi: 3.0.0
info:
  title: ACOS Portfolio AI Events
  version: 1.0.0
  description: |
    Asynchronous Portfolio AI events.
    Producers: acos-business-platform, acos-ai-platform.
    Consumers: acos-business-platform, portfolio agents, notification services.

defaultContentType: application/json

channels:
  portfolioUpdated:
    address: acos.ai.portfolio.updated.v1
    messages:
      PortfolioUpdated:
        $ref: '#/components/messages/PortfolioUpdated'
    description: Emitted when portfolio projects/skills change and may require AI review.

  portfolioReviewed:
    address: acos.ai.portfolio.reviewed.v1
    messages:
      PortfolioReviewed:
        $ref: '#/components/messages/PortfolioReviewed'
    description: Emitted after Portfolio AI completes a review.

  skillGapDetected:
    address: acos.ai.portfolio.skill-gap-detected.v1
    messages:
      SkillGapDetected:
        $ref: '#/components/messages/SkillGapDetected'
    description: Emitted when skill-gap analysis identifies missing skills for a target role.

operations:
  publishPortfolioUpdated:
    action: send
    channel:
      $ref: '#/channels/portfolioUpdated'
  onPortfolioUpdated:
    action: receive
    channel:
      $ref: '#/channels/portfolioUpdated'
  publishPortfolioReviewed:
    action: send
    channel:
      $ref: '#/channels/portfolioReviewed'
  onPortfolioReviewed:
    action: receive
    channel:
      $ref: '#/channels/portfolioReviewed'
  publishSkillGapDetected:
    action: send
    channel:
      $ref: '#/channels/skillGapDetected'
  onSkillGapDetected:
    action: receive
    channel:
      $ref: '#/channels/skillGapDetected'

components:
  schemas:
    PortfolioUpdatedData:
      type: object
      additionalProperties: false
      required: [userId, updatedAt]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        projectIds:
          type: array
          items:
            type: string
            format: uuid
        updatedAt:
          type: string
          format: date-time
        changeType:
          type: string
          enum: [PROJECT, SKILL, TECHNOLOGY, CERTIFICATION, ACHIEVEMENT]

    PortfolioReviewedData:
      type: object
      additionalProperties: false
      required: [userId, reviewedAt, score]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        reviewedAt:
          type: string
          format: date-time
        score:
          type: number
          format: double
          minimum: 0
          maximum: 100
        targetRole:
          type: string
        summary:
          type: string

    SkillGapDetectedData:
      type: object
      additionalProperties: false
      required: [userId, targetRole, detectedAt, missingSkills]
      properties:
        userId:
          $ref: '../common/common-events.yaml#/components/schemas/UserId'
        targetRole:
          type: string
        detectedAt:
          type: string
          format: date-time
        missingSkills:
          type: array
          items:
            type: string
          minItems: 1
        recommendedActions:
          type: array
          items:
            type: string

  messages:
    PortfolioUpdated:
      name: PortfolioUpdated
      title: Portfolio updated
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/PortfolioUpdatedData'
      examples:
        - name: projectChanged
          headers:
            correlationId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            eventId: d4e5f6a7-b8c9-0123-def0-234567890123
            schemaVersion: 1.0.0
            producedAt: 2026-08-07T11:00:00Z
            producer: acos-business-platform
          payload:
            userId: 11111111-1111-1111-1111-111111111111
            projectIds:
              - 77777777-7777-7777-7777-777777777777
            updatedAt: 2026-08-07T11:00:00Z
            changeType: PROJECT

    PortfolioReviewed:
      name: PortfolioReviewed
      title: Portfolio reviewed
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/PortfolioReviewedData'

    SkillGapDetected:
      name: SkillGapDetected
      title: Skill gap detected
      contentType: application/json
      headers:
        $ref: '../common/common-events.yaml#/components/schemas/EventHeaders'
      payload:
        $ref: '#/components/schemas/SkillGapDetectedData'
