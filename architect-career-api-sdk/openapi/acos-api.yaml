components:
  schemas:
    TechnologyRequest:
      type: object
      description: Payload used to create or update a technology
      properties:
        name:
          type: string
          description: Technology name
          example: Spring Boot
          maxLength: 100
          minLength: 0
        category:
          type:
            - string
            - 'null'
          description: Optional category
          example: Backend
          maxLength: 100
          minLength: 0
      required:
        - name
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorDetail'
    ApiResponseTechnologyResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TechnologyResponse'
        error:
          $ref: '#/components/schemas/ApiError'
        correlationId:
          type: string
        timestamp:
          type: string
          format: date-time
    FieldErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        rejectedValue: {}
    TechnologyResponse:
      type: object
      description: Portfolio technology
