services:
  web:
    build:
      context: .
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-ACOS}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.1.0}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_ENABLE_QUERY_DEVTOOLS: ${VITE_ENABLE_QUERY_DEVTOOLS:-false}
        VITE_AI_PLATFORM_ENABLED: ${VITE_AI_PLATFORM_ENABLED:-true}
    image: acos-web
    ports:
      - "${WEB_PORT:-5173}:80"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
